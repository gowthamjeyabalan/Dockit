[package]
name = "dockit"
version = "0.1.0"
edition = "2024"
description = "A PDF editor: edit text, images and shapes, merge and split files, annotate, fill forms and sign"
authors = ["Gowtham Jeyabalan"]

[dependencies]
# Same renderer choice as Overlay: OpenGL (glow) is lighter than wgpu.
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "glow", "persistence"] }
egui = "0.36"
egui_dock = { version = "0.21", features = ["serde"] }
# Only the raw PDFium function table is used (see src/pdf.rs); pdfium.dll ships next to the exe.
pdfium-render = { version = "0.9.4", default-features = false, features = ["pdfium_7881"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "tiff"] }
lopdf = { version = "0.45.0", default-features = false }
# Patterns for find-and-redact (emails, numbers, the user's own).
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-perl", "unicode-case"] }



[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2

[build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
# Windows' built-in text recognition (OCR) and voices (read aloud).
windows = { version = "0.62", features = ["Foundation", "Foundation_Collections", "Globalization", "Graphics_Imaging", "Media_Ocr", "Security_Cryptography", "Storage_Streams", "Win32_Media_Audio", "Win32_Media_Speech", "Win32_System_Com", "Win32_System_WinRT"] }
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_Storage_Xps", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Controls_Dialogs", "Win32_UI_Input_KeyboardAndMouse"] }
